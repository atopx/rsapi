[package]
name = "rsapi"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.44.2", default-features = false, features = ["rt-multi-thread", "signal" ] }
axum = { version = "0.8", features = ["multipart"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fastrand = "2.3.0"

config = { version = "0.15", default-features = false, features = ["toml"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
opt-level = "s"
strip = "symbols"
